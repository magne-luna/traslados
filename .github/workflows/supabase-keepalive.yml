name: Supabase keep-alive

# Supabase free tier pauses a project after 7 days without activity.
# Every 2 days: runs `select 1` via the Management API, or asks for a restore if it is paused.
# Needs the repo secret SUPABASE_ACCESS_TOKEN (personal access token of the Supabase account
# that owns the project: https://supabase.com/dashboard/account/tokens).

on:
  schedule:
    - cron: "0 9 */2 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: pkryfoljypuzfifofdwp
    steps:
      - name: Ping Supabase
        run: |
          set -euo pipefail
          : "${SUPABASE_ACCESS_TOKEN:?Missing secret SUPABASE_ACCESS_TOKEN}"
          API="https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}"
          AUTH="Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}"
          status=$(curl -fsS --max-time 30 -H "$AUTH" "$API" | sed -nE 's/.*"status":"([A-Z_]+)".*/\1/p')
          echo "Project status: ${status:-unknown}"
          case "$status" in
            ACTIVE_HEALTHY)
              curl -fsS --max-time 30 -H "$AUTH" -H "Content-Type: application/json" \
                -X POST "$API/database/query" -d '{"query":"select 1 as keepalive"}' >/dev/null
              echo "Keep-alive query OK" ;;
            INACTIVE)
              curl -fsS --max-time 60 -H "$AUTH" -X POST "$API/restore" >/dev/null
              echo "Project was paused, restore requested" ;;
            COMING_UP|RESTORING|RESTARTING|UNKNOWN)
              echo "Project is starting; nothing to do" ;;
            *)
              echo "Unexpected status '$status'" >&2; exit 1 ;;
          esac
